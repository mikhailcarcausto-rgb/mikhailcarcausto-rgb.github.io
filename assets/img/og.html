<!DOCTYPE html>
<!-- Source for og.png. Open at 1200x630 and screenshot. Not linked from the site. -->
<html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;background:#0F2A4A;color:#fff;
       font-family:"IBM Plex Sans",sans-serif;position:relative}
  .arc{position:absolute;right:-140px;top:-220px;width:720px;height:720px;border:1px solid rgba(255,255,255,.12);border-radius:50%}
  .arc2{position:absolute;right:-40px;top:-120px;width:520px;height:520px;border:1px solid rgba(255,255,255,.07);border-radius:50%}
  .in{position:relative;padding:64px 76px;height:100%;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:14px}
  .top svg{width:44px;height:44px}
  .top b{font-weight:700;font-size:30px;letter-spacing:.01em}
  .kick{margin-top:auto;font:500 17px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#E08A4E}
  h1{margin-top:20px;font-weight:400;font-size:84px;line-height:1.05;letter-spacing:-.015em}
  h1 b{display:block;font-weight:700}
  .bar{margin-top:auto;display:flex;gap:56px;border-top:1px solid rgba(255,255,255,.18);padding-top:26px}
  .bar div b{display:block;font-weight:700;font-size:30px}
  .bar div span{display:block;margin-top:4px;font-size:16px;color:#9FB3CC}
</style></head>
<body><div class="arc"></div><div class="arc2"></div><div class="in">
  <div class="top">
    <svg viewBox="0 0 44 44" fill="none">
      <path d="M4 12 L22 34 L40 12" stroke="#FFFFFF" stroke-opacity=".4" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M10 13.5 L22 28 L34 13.5" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M16 15 L22 22 L28 15" stroke="#E08A4E" stroke-width="2.8" stroke-linejoin="round"/>
    </svg>
    <b>MC Advisory</b>
  </div>
  <p class="kick">Contratos y Abastecimiento Minero</p>
  <h1>Menos papeleo.<b>MÁS MINA.</b></h1>
  <div class="bar">
    <div><b>USD 680M</b><span>en contratos prime</span></div>
    <div><b>100+</b><span>licitaciones</span></div>
    <div><b>12+</b><span>años en minería</span></div>
    <div><b>PE · CL · AU</b><span>tres países</span></div>
  </div>
</div></body></html>
