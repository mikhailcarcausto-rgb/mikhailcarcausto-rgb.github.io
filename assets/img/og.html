<!DOCTYPE html>
<!-- Source for og.png. Open at 1200x630 and screenshot. Not linked from the site. -->
<html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..700,0..100,0..1;1,9..144,400..700,0..100,0..1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;background:#0C100F;color:#EDE7DC;
       font-family:"IBM Plex Mono",monospace;position:relative}
  .bg{position:absolute;inset:0;
      background:
        radial-gradient(70% 60% at 82% 6%,rgba(200,106,50,.30),transparent 62%),
        radial-gradient(55% 45% at 6% 92%,rgba(95,168,140,.13),transparent 65%),
        repeating-linear-gradient(177deg,transparent 0 44px,rgba(237,231,220,.028) 44px 45px);}
  .in{position:relative;padding:70px 76px;height:100%;display:flex;flex-direction:column}
  .top{display:flex;justify-content:space-between;align-items:center;
       font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:#7D8781;
       border-bottom:1px solid rgba(237,231,220,.13);padding-bottom:22px}
  .top b{color:#EDE7DC;font-weight:500;letter-spacing:.02em;text-transform:none;font-size:19px}
  h1{font-family:Fraunces,serif;font-weight:600;font-size:118px;line-height:.9;
     letter-spacing:-.035em;margin-top:auto;font-variation-settings:"SOFT" 18,"WONK" 1}
  h1 em{display:block;color:#E4915A;font-style:italic}
  p{margin-top:30px;font-size:21px;line-height:1.5;color:#B9BDB6;max-width:44ch;font-family:system-ui,sans-serif}
  .foot{margin-top:auto;padding-top:26px;border-top:1px solid rgba(237,231,220,.13);
        display:flex;gap:40px;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#7D8781}
  .foot span:first-child{color:#C86A32}
</style></head>
<body><div class="bg"></div><div class="in">
  <div class="top"><b>Mikhail Carcausto</b><span>Contratos &amp; Abastecimiento · Minería</span></div>
  <h1>Menos papeleo.<em>Más mina.</em></h1>
  <p>Automatización documental, desempeño de contratistas y reportería ejecutiva de C&amp;P.</p>
  <div class="foot"><span>Perú · LATAM</span><span>ES · EN</span><span>Compañías mineras &amp; proveedores</span></div>
</div></body></html>
