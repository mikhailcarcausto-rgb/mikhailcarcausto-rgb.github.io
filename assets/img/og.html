<!DOCTYPE html>
<!-- Source for og.jpg: open at 1200x630 (DPR 1), screenshot, save as JPEG q88. Not linked from the site. -->
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500..700&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;color:#fff;font-family:"Space Grotesk",system-ui,sans-serif;position:relative;
    background:
      radial-gradient(46% 70% at 80% 52%,rgba(76,201,174,.16) 0%,transparent 72%),
      radial-gradient(30% 40% at 6% 4%,rgba(217,149,106,.08) 0%,transparent 70%),
      linear-gradient(180deg,#06110F 0%,#0A1916 55%,#0E221E 100%)}
  .topo{position:absolute;inset:0;
    -webkit-mask-image:linear-gradient(90deg,transparent 8%,rgba(0,0,0,.3) 38%,#000 66%)}
  .topo::before{content:"";position:absolute;inset:-6% -2% -6% 8%;background:rgba(76,201,174,.32);
    -webkit-mask:url(topo.svg) center/cover no-repeat}
  .in{position:absolute;inset:0;padding:62px 520px 58px 84px;display:flex;flex-direction:column}
  .arch{position:absolute;right:92px;top:132px;width:356px;bottom:0;border-radius:999px 999px 0 0;
    background:radial-gradient(90% 55% at 50% 0%,rgba(76,201,174,.30),transparent 72%),linear-gradient(180deg,rgba(76,201,174,.12),rgba(76,201,174,.03) 70%);
    border:1px solid rgba(76,201,174,.4);border-bottom:0;
    -webkit-mask-image:linear-gradient(180deg,#000 60%,transparent 96%)}
  .ph{position:absolute;right:54px;top:28px;width:432px}
  .ph img{display:block;width:100%;height:auto;filter:drop-shadow(0 24px 28px rgba(0,0,0,.35))}
  .top{display:flex;align-items:center;gap:16px}
  .top svg{width:60px;height:60px}
  .top b{font-weight:700;font-size:32px}
  .top b span{font-weight:500;color:rgba(255,255,255,.62)}
  .ey{margin-top:auto;align-self:flex-start;padding:9px 18px;border-radius:999px;border:1.6px solid rgba(76,201,174,.85);
      font-weight:700;font-size:15px;letter-spacing:.18em;text-transform:uppercase;background:rgba(255,255,255,.04)}
  h1{margin-top:22px;font-weight:700;font-size:84px;line-height:.98;letter-spacing:-.03em}
  h1 em{display:block;font-style:normal;color:#4CC9AE}
  .bar{margin-top:30px;display:flex;gap:14px}
  .kt{padding:14px 18px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18)}
  .kt b{display:block;font-weight:700;font-size:28px}
  .kt span{display:block;margin-top:3px;font-size:15px;color:rgba(255,255,255,.66);font-family:system-ui,sans-serif}
</style></head>
<body><div class="topo"></div><div class="arch"></div>
<div class="ph"><img src="photos/hero-900.webp" alt=""></div>
<div class="in">
  <div class="top">
    <svg viewBox="0 0 48 48"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#132D28"/><stop offset="1" stop-color="#06110F"/></linearGradient></defs>
      <rect width="48" height="48" rx="11" fill="url(#g)"/><rect x=".6" y=".6" width="46.8" height="46.8" rx="10.4" fill="none" stroke="rgba(255,255,255,.2)"/>
      <path d="M36.5 14.5 A15 15 0 1 0 36.5 33.5" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>
      <path d="M15 31 L20.5 19 L24.5 26 L28.5 19 L34 31" fill="none" stroke="#4CC9AE" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <b>MC <span>Advisory</span></b>
  </div>
  <p class="ey">Mentoría y consultoría · Supply minero</p>
  <h1>Menos teoría.<em>Más criterio.</em></h1>
  <div class="bar">
    <div class="kt"><b>USD 680M</b><span>en contratos prime a cargo</span></div>
    <div class="kt"><b>100+</b><span>licitaciones lideradas</span></div>
  </div>
</div></body></html>
